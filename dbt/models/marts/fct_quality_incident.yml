version: 2

models:
  - name: fct_quality_incident
    description: >
      Une ligne par incident qualité. supplier_key suit la même logique de
      fallback SCD2 que les autres facts (voir ADR-0004). po_id nullable,
      cohérent avec les incidents non rattachés à une commande précise.
    columns:
      - name: incident_id
        description: Identifiant de l'incident, grain de la table de faits.
        tests:
          - not_null
          - unique
      - name: supplier_key
        description: Version du fournisseur active à la date de l'incident (ou version courante en fallback).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: part_id
        description: Pièce concernée.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_part')
                field: part_id
