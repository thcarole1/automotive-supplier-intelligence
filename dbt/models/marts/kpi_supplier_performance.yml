version: 2

models:
  - name: kpi_supplier_performance
    description: >
      KPI de performance par fournisseur (version courante uniquement) :
      OTD (fraction 0-1), PPM qualité, lead time moyen et variabilité.
    columns:
      - name: supplier_id
        description: Identifiant du fournisseur, grain de ce KPI.
        tests:
          - not_null
          - unique
      - name: otd_ratio
        description: Part des livraisons à l'heure parmi les livraisons réalisées (fraction 0-1).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: ppm
        description: Non-conformités par million d'unités livrées.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
